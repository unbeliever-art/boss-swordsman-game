name: Build Mansion Mystery APK

on:
  push:
    branches:
      - mansion-mystery-apk
    paths-ignore:
      - "builds/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config/godot
          if [ -d /root/.local/share/godot/export_templates/4.3.stable ]; then
            cp -a /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/
          fi
          cat > ~/.config/godot/editor_settings-4.3.tres <<'SETTINGS'
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/timestamping_authority_url = ""
          export/android/shutdown_adb_on_exit = true
          SETTINGS
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Import and validate project
        run: godot --headless --editor --path mansion_mystery_godot --quit

      - name: Build APK
        run: |
          mkdir -p build/android
          godot --headless --verbose --path mansion_mystery_godot --export-debug "Android" build/android/MansionMystery-Episode1-v0.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MansionMystery-Episode1-APK
          path: build/android/MansionMystery-Episode1-v0.1.apk
          if-no-files-found: error

      - name: Save APK in repository
        run: |
          test -f build/android/MansionMystery-Episode1-v0.1.apk
          mkdir -p builds
          cp build/android/MansionMystery-Episode1-v0.1.apk builds/MansionMystery-Episode1-v0.1.apk
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds/MansionMystery-Episode1-v0.1.apk
          git commit -m "Add Mansion Mystery Episode 1 APK" || exit 0
          git push origin HEAD:mansion-mystery-apk
