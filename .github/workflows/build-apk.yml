name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "builds/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot and Android SDK
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config/godot
          if [ -d /root/.local/share/godot/export_templates/4.3.stable ]; then
            cp -a /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/
          fi
          cat > ~/.config/godot/editor_settings-4.3.tres <<'EOF'
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/timestamping_authority_url = ""
          export/android/shutdown_adb_on_exit = true
          EOF
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Unpack game
        run: |
          unzip -o boss_swordsman_godot_prototype_v01.zip
          sed -i 's/handheld\/orientation=1/handheld\/orientation=0/' boss_swordsman_godot_prototype/project.godot
          echo 'textures/vram_compression/import_etc2_astc=true' >> boss_swordsman_godot_prototype/project.godot

      - name: Create Android preset
        run: |
          cat > boss_swordsman_godot_prototype/export_presets.cfg <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=10
          version/name="0.9"
          package/unique_name="com.unbelieverart.bossswordsman"
          package/name="Boss Swordsman Prototype"
          package/signed=true
          screen/immersive_mode=true
          screen/orientation=0
          EOF

      - name: Build APK
        run: |
          test -f /root/debug.keystore
          test -x /usr/lib/jvm/java-17-openjdk-amd64/bin/java
          test -d /usr/lib/android-sdk
          mkdir -p build/android
          cd boss_swordsman_godot_prototype
          godot --headless --editor --quit
          godot --headless --verbose --export-debug "Android" ../build/android/BossSwordsman-Prototype-v0.9.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BossSwordsman-Prototype-v0.9-APK
          path: build/android/BossSwordsman-Prototype-v0.9.apk
          if-no-files-found: error

      - name: Save direct APK in repository
        run: |
          mkdir -p builds
          cp build/android/BossSwordsman-Prototype-v0.9.apk builds/BossSwordsman-Prototype-v0.9.apk
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds/BossSwordsman-Prototype-v0.9.apk
          git commit -m "Add direct APK v0.9" || exit 0
          git push
